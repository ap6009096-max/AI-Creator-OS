[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-creator-os"
version = "2.0.0"
description = "AI Creator OS — Multi-Agent Content Production Operating System"
authors = [
    { name = "AI Creator OS Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.39.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "parallel-web>=1.0.1",
    "opencv-python-headless>=4.10.0",
    "ffmpeg-python>=0.2.0",
    "moviepy>=1.0.3",
    "openai-whisper>=20231117",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "yt-dlp>=2025.1.0",
    "pillow>=10.4.0",
    "tqdm>=4.66.0",
    "tenacity>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
